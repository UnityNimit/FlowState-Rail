services:
  - type: web
    name: flowstate-rail-api
    runtime: python
    rootDir: Backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn main:socket_app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEMO_MODE
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WORKSPACE_TOKEN_SECRET
        generateValue: true
